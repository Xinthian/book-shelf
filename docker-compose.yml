services:
  book-shelf:
    build:
      context: .
    image: book-shelf:local
    container_name: book-shelf
    ports:
      - "${BOOK_SHELF_PORT:-13378}:80"
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - ./books:/books
      - ./metadata:/metadata
      - ./config:/config
    restart: unless-stopped
